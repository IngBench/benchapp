name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Deploy dist to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          
          # Probar conexion SSH
          ssh -o StrictHostKeyChecking=no -p 22 -i ~/.ssh/id_deploy $USER@$HOST "echo 'Conectado exitosamente al VPS'"
          
          # Sincronizar archivos
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -p 22 -i ~/.ssh/id_deploy" dist/ $USER@$HOST:/var/www/html/
